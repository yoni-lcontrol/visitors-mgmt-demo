<!DOCTYPE html>
<html dir="rtl"
      lang="he">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>{{SUBJECT}}</title>
</head>

<body
      style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
    <!-- Outer wrapper -->
    <table role="presentation"
           width="100%"
           cellpadding="0"
           cellspacing="0"
           border="0"
           style="background-color:#f4f5f7;">
        <tr>
            <td align="center"
                style="padding:24px 16px;">
                <!-- Main card -->
                <table role="presentation"
                       width="600"
                       cellpadding="0"
                       cellspacing="0"
                       border="0"
                       style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">

                    <!-- Header with logo -->
                    <tr>
                        <td
                            style="background:linear-gradient(135deg,#020140 0%,#1a1a6e 100%);padding:28px 32px;text-align:center;">
                            <table role="presentation"
                                   cellpadding="0"
                                   cellspacing="0"
                                   border="0"
                                   align="center">
                                <tr>
                                    <td style="vertical-align:middle;padding-left:14px;">
                                        <span
                                              style="font-size:28px;font-weight:bold;color:#ffffff;letter-spacing:1px;">מגדל</span>
                                        <br>
                                        <span
                                              style="font-size:13px;color:rgba(255,255,255,0.7);letter-spacing:0.5px;">מערכת
                                            ניהול מבקרים</span>
                                    </td>
                                    <td style="vertical-align:middle;">
                                        <!-- Tower icon rendered as table-based shape for email compatibility -->
                                        <table role="presentation"
                                               cellpadding="0"
                                               cellspacing="0"
                                               border="0"
                                               align="center">
                                            <tr>
                                                <td style="padding:0 2px;">
                                                    <div
                                                         style="width:5px;height:10px;background:#ffffff;border-radius:1px;">
                                                    </div>
                                                </td>
                                                <td style="padding:0 2px;">
                                                    <div
                                                         style="width:5px;height:10px;background:#ffffff;border-radius:1px;">
                                                    </div>
                                                </td>
                                                <td style="padding:0 2px;">
                                                    <div
                                                         style="width:5px;height:10px;background:#ffffff;border-radius:1px;">
                                                    </div>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td colspan="3"
                                                    style="padding-top:2px;">
                                                    <div
                                                         style="width:25px;height:18px;background:#ffffff;border-radius:2px;">
                                                    </div>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td colspan="3"
                                                    style="padding-top:2px;">
                                                    <div
                                                         style="width:31px;height:5px;background:#ffffff;border-radius:1px;margin:0 auto;">
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Accent bar -->
                    <tr>
                        <td style="height:4px;background:linear-gradient(90deg,#6c63ff 0%,#4ecdc4 50%,#6c63ff 100%);">
                        </td>
                    </tr>

                    <!-- Event badge -->
                    <tr>
                        <td style="padding:24px 32px 0 32px;text-align:center;">
                            <table role="presentation"
                                   cellpadding="0"
                                   cellspacing="0"
                                   border="0"
                                   align="center">
                                <tr>
                                    <td
                                        style="background-color:{{BADGE_BG}};color:{{BADGE_COLOR}};font-size:14px;font-weight:bold;padding:8px 20px;border-radius:20px;letter-spacing:0.5px;">
                                        {{BADGE_TEXT}}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Content area -->
                    <tr>
                        <td style="padding:20px 32px 28px 32px;">
                            {{CONTENT}}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#f8f9fa;padding:20px 32px;border-top:1px solid #e9ecef;">
                            <table role="presentation"
                                   width="100%"
                                   cellpadding="0"
                                   cellspacing="0"
                                   border="0">
                                <tr>
                                    <td style="text-align:center;">
                                        <p style="margin:0 0 4px 0;font-size:12px;color:#8c8c8c;">הודעה זו נשלחה
                                            אוטומטית ממערכת ניהול המבקרים של מגדל</p>
                                        <p style="margin:0;font-size:11px;color:#b0b0b0;">אין להשיב להודעה זו</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
                <!-- /Main card -->
            </td>
        </tr>
    </table>
</body>

</html>
