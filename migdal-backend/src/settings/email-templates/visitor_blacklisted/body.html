<div
     style="background-color:#fdf0f0;border:2px solid #d9534f;border-radius:8px;padding:16px 20px;margin-bottom:20px;text-align:center;">
    <h2 style="margin:0 0 8px 0;font-size:22px;color:#d9534f;font-weight:700;">&#9888; אזהרה: מבקר ברשימה שחורה!</h2>
    <p style="margin:0;font-size:14px;color:#a94442;">מבקר שמופיע ברשימה השחורה הגיע לאתר. נדרשת התייחסות מיידית.</p>
</div>
<table role="presentation"
       width="100%"
       cellpadding="0"
       cellspacing="0"
       border="0"
       style="background-color:#f8f9fa;border-radius:8px;overflow:hidden;">
    <tr>
        <td
            style="padding:14px 18px;border-bottom:1px solid #e9ecef;font-weight:600;color:#020140;width:120px;font-size:14px;">
            שם</td>
        <td style="padding:14px 18px;border-bottom:1px solid #e9ecef;color:#d9534f;font-weight:700;font-size:14px;">
            {{visitor.firstName}} {{visitor.lastName}}</td>
    </tr>
    <tr>
        <td style="padding:14px 18px;border-bottom:1px solid #e9ecef;font-weight:600;color:#020140;font-size:14px;">ת.ז.
        </td>
        <td style="padding:14px 18px;border-bottom:1px solid #e9ecef;color:#333;font-size:14px;">{{visitor.personId}}
        </td>
    </tr>
    <tr>
        <td style="padding:14px 18px;border-bottom:1px solid #e9ecef;font-weight:600;color:#020140;font-size:14px;">
            ביקור</td>
        <td style="padding:14px 18px;border-bottom:1px solid #e9ecef;color:#333;font-size:14px;">{{visit.title}}</td>
    </tr>
    <tr>
        <td style="padding:14px 18px;font-weight:600;color:#020140;font-size:14px;">מארח</td>
        <td style="padding:14px 18px;color:#333;font-size:14px;">{{visit.hostName}}</td>
    </tr>
</table>
