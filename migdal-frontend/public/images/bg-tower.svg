<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 400" fill="#9896ad" opacity="0.18">
  <!-- MIGDAL TOWER — Background watermark variant -->

  <!-- TOP: Three small battlements -->
  <rect x="90" y="0" width="18" height="30" rx="1"/>
  <rect x="116" y="0" width="18" height="30" rx="1"/>
  <rect x="142" y="0" width="18" height="30" rx="1"/>

  <!-- UPPER TOWER: Narrow horizontal stripes -->
  <rect x="82" y="34" width="86" height="12" rx="1"/>
  <rect x="82" y="50" width="86" height="12" rx="1"/>
  <rect x="82" y="66" width="86" height="12" rx="1"/>
  <rect x="82" y="82" width="86" height="12" rx="1"/>

  <!-- WIDENING TRAPEZOID -->
  <polygon points="78,98 172,98 195,145 55,145"/>

  <!-- CASTLE SECTION: battlements + arch -->
  <rect x="52" y="148" width="42" height="22" rx="1"/>
  <rect x="104" y="148" width="42" height="22" rx="1"/>
  <rect x="156" y="148" width="42" height="22" rx="1"/>

  <path d="
    M 42,173 L 208,173 L 208,260 L 42,260 Z
    M 105,260 L 105,220 Q 105,195 125,195 Q 145,195 145,220 L 145,260 Z
  " fill-rule="evenodd"/>

  <!-- LOWER SECTION: Wide horizontal stripes -->
  <rect x="30" y="266" width="190" height="14" rx="1"/>
  <rect x="30" y="284" width="190" height="14" rx="1"/>
  <rect x="30" y="302" width="190" height="14" rx="1"/>
  <rect x="30" y="320" width="190" height="14" rx="1"/>

  <!-- STEPPED BASE -->
  <rect x="45" y="340" width="160" height="12" rx="1"/>
  <rect x="55" y="356" width="140" height="12" rx="1"/>
  <rect x="65" y="372" width="120" height="12" rx="1"/>
</svg>
