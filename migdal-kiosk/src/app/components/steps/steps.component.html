<div class="steps"
     [class.error]="error"
     role="group"
     [attr.aria-label]="'COMMON.PROCESS_STEPS' | translate">
      <button *ngFor="let s of steps"
              type="button"
              class="step"
              [class.active]="s.isActive"
              [class.current]="s.isCurrent"
              [attr.aria-label]="s.label"
              [attr.aria-current]="s.isCurrent ? 'step' : null"
              tabindex="-1">

            <ng-container [ngSwitch]="s.id">
                  <!-- Step 1: ID Scan -->
                  <svg *ngSwitchCase="1"
                       viewBox="0 0 24 24"
                       class="icon"
                       aria-hidden="true">
                        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2Zm0 14H4V8h16v10Zm-9-1h7v-2h-7v2Zm-5-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2Zm-2 3h6v-1c0-1.1-2-2-3-2s-3 .9-3 2v1Z"
                              fill="currentColor" />
                  </svg>

                  <!-- Step 2: Verify Details -->
                  <svg *ngSwitchCase="2"
                       viewBox="0 0 24 24"
                       class="icon"
                       aria-hidden="true">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"
                              fill="currentColor" />
                  </svg>

                  <!-- Step 3: Consent/Signature -->
                  <svg *ngSwitchCase="3"
                       viewBox="0 0 24 24"
                       class="icon"
                       aria-hidden="true">
                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25Zm2.92 2.83H5v-.92l9.06-9.06.92.92L5.92 20.08ZM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82Z"
                              fill="currentColor" />
                  </svg>

                  <!-- Step 4: Complete -->
                  <svg *ngSwitchCase="4"
                       viewBox="0 0 24 24"
                       class="icon"
                       aria-hidden="true">
                        <path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
                              fill="currentColor" />
                  </svg>
            </ng-container>
      </button>
</div>
