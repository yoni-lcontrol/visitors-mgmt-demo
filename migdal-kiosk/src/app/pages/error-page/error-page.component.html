<div class="error-container">

  <!-- Header -->
  <div class="header">
    <div class="header-title">
      {{ 'ERROR.TITLE' | translate }}
    </div>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Error icon -->
    <div class="center">
      <div class="error-icon"
           aria-hidden="true">
        <svg viewBox="0 0 24 24"
             class="error-svg">
          <path fill="currentColor"
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z" />
        </svg>
      </div>
    </div>

    <!-- Message -->
    <div class="subtitle">
      {{ 'ERROR.MESSAGE' | translate }}
    </div>

    <!-- Hint -->
    <div class="hint">
      {{ 'ERROR.HINT' | translate }}
    </div>

    <!-- Info card -->
    <div class="info-card">
      <div class="info-card-top"></div>
      <div class="info-card-content">
        <div class="info-row accent">
          <div class="info-ic"
               aria-hidden="true">
            <svg viewBox="0 0 24 24"
                 class="info-svg">
              <path fill="currentColor"
                    d="M20 15.5c-1.25 0-2.45-.2-3.57-.57a1.02 1.02 0 0 0-1.02.24l-2.2 2.2a15.045 15.045 0 0 1-6.59-6.59l2.2-2.21a.96.96 0 0 0 .25-1A11.36 11.36 0 0 1 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1Z" />
            </svg>
          </div>
          <div class="info-text">
            {{ 'ERROR.RECEPTION_HELP' | translate }}
          </div>
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="bottom">

      <button type="button"
              class="btn-prev"
              (click)="home()">
        <span class="btn-prev-bg"></span>
        <span class="btn-prev-text">
          {{ 'COMMON.HOME_SCREEN' | translate }}
        </span>
      </button>

      <button type="button"
              class="continue"
              (click)="retry()">
        <span class="continue-bg"></span>
        <span class="continue-text">
          {{ 'COMMON.TRY_AGAIN' | translate }}
        </span>
      </button>

    </div>

  </div>

  <!-- Battlement -->
  <div class="battlement"
       aria-hidden="true"></div>

</div>
